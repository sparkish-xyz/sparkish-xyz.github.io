<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <title>Korea Map Link — Choose language</title>
  <meta name="description" content="Choose the English, French, Japanese, Korean, or Chinese landing page for Korea Map Link.">
  <link rel="canonical" href="https://sparkish-xyz.github.io/korea-map-link/en/">
  <link rel="stylesheet" href="/korea-map-link/assets/kmb-site.css">
  <script>
    (function () {
      var map = {
        ko: '/korea-map-link/ko/',
        en: '/korea-map-link/en/',
        fr: '/korea-map-link/fr/',
        ja: '/korea-map-link/ja/',
        'zh-Hans': '/korea-map-link/zh-Hans/',
        'zh-Hant': '/korea-map-link/zh-Hant/'
      };
      var storageAvailable = true;
      try {
        var pref = localStorage.getItem('kmbLangPref');
        if (pref && map[pref]) {
          location.replace(map[pref]);
          return;
        }
      } catch (e) {
        storageAvailable = false;
      }
      var lang = (navigator.language || 'en').toLowerCase();
      if (lang.indexOf('ko') === 0) location.replace(map.ko);
      else if (lang.indexOf('fr') === 0) location.replace(map.fr);
      else if (lang.indexOf('ja') === 0) location.replace(map.ja);
      else if (lang === 'zh-tw' || lang === 'zh-hk' || lang === 'zh-mo') location.replace(map['zh-Hant']);
      else if (lang.indexOf('zh') === 0) location.replace(map['zh-Hans']);
      else location.replace(map.en);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Korea Map Link</h1>
    <p>Redirecting… <a href="/korea-map-link/en/">Continue in English</a></p>
    <ul>
      <li><a href="/korea-map-link/en/" hreflang="en">English</a></li>
      <li><a href="/korea-map-link/fr/" hreflang="fr">Français</a></li>
      <li><a href="/korea-map-link/ko/" hreflang="ko">한국어</a></li>
      <li><a href="/korea-map-link/ja/" hreflang="ja">日本語</a></li>
      <li><a href="/korea-map-link/zh-Hans/" hreflang="zh-Hans">简体中文</a></li>
      <li><a href="/korea-map-link/zh-Hant/" hreflang="zh-Hant">繁體中文</a></li>
    </ul>
  </main>
</body>
</html>
